name: Check source
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-build.txt
      - run: python tools/workflow.py check
      - run: python -m unittest discover -s tests -v
      - name: Public Mono toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            mono-mcs=6.8.0.105+dfsg-3.6ubuntu2
      - name: Standalone C# behavior contracts
        run: python tools/test.py --standalone
